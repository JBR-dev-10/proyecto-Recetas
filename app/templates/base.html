<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recetas IA{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }
        nav {
            background: #0f172a;
            color: #ffffff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: #e2e8f0;
            text-decoration: none;
            margin-left: 1.2rem;
            font-weight: 500;
        }
        nav a:hover {
            color: #60a5fa;
        }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: #ffffff;
            padding: 1.8rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <nav>
        <div><strong>Recetas IA</strong></div>
        <div>
            <a href="/">Inicio</a>
            <a href="/panel">Panel</a>
            <a href="/docs">Swagger API</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
